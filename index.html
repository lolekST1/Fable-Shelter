<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#bfe3f2" />
    <title>Fable Shelter</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fable Shelter" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 56 C8 40 4 26 12 16 C20 7 30 11 32 19 C34 11 44 7 52 16 C60 26 56 40 32 56Z' fill='%23ff5f86'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f2; touch-action: none; -webkit-user-select: none; user-select: none; }
      canvas { display: block; width: 100%; height: 100%; }
      #hint { position: fixed; left: 50%; top: 69%; width: 56px; height: 56px; margin-left: -28px; pointer-events: none; transition: opacity .6s; animation: tap 1.4s ease-in-out infinite; }
      #hint.hidden { opacity: 0; }
      @keyframes tap { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(8px) scale(.92); } }
      /* loading bar: shows before the game's code arrives, main.ts fills it (--p) and hides it once the camp is ready */
      #load { position: fixed; left: 50%; top: 46%; width: min(260px, 60vw); transform: translateX(-50%); text-align: center; pointer-events: none; transition: opacity .5s; z-index: 5; }
      #load.done { opacity: 0; }
      #load svg { width: 46px; height: 46px; animation: beat 1s ease-in-out infinite; }
      #load .bar { height: 14px; margin-top: 10px; border-radius: 9px; background: rgba(255,255,255,.75); box-shadow: 0 2px 8px rgba(40,70,60,.2); overflow: hidden; }
      #load .bar i { display: block; height: 100%; width: calc(var(--p, .08) * 100%); border-radius: 9px; background: #ff7aa2; transition: width .3s; }
      @keyframes beat { 50% { transform: scale(1.12); } }
      #ver { position: fixed; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom)); font: 11px system-ui, sans-serif; color: rgba(40,70,60,.45); pointer-events: none; }
    </style>
  </head>
  <body>
    <svg id="hint" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="26" cy="14" r="9" fill="none" stroke="#fff" stroke-width="3" opacity=".8" />
      <path d="M22 14v26l-6-6c-3-3-8 1-5 5l12 14c2 3 5 5 9 5h10c6 0 10-4 10-10V30c0-3-4-4-6-2v-3c0-3-5-4-6-1v-2c0-3-5-4-6-1V14c0-4-6-4-6 0z" fill="#fff" stroke="#5b7f73" stroke-width="2.5" stroke-linejoin="round" />
    </svg>
    <div id="load" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M32 56 C8 40 4 26 12 16 C20 7 30 11 32 19 C34 11 44 7 52 16 C60 26 56 40 32 56Z" fill="#ff5f86" /></svg>
      <div class="bar"><i></i></div>
    </div>
    <div id="ver">prototype 0.8</div>
    <script>
      // When the game cannot start (an old device without WebGL 2, a script error), say why instead of a blank sky.
      // A plain script, so it runs even where the game's module cannot.
      (function () {
        var shown = false;
        function why(msg) {
          if (shown || document.querySelector('canvas')) return;
          shown = true;
          var gl2 = false, gl1 = '';
          try { gl2 = !!document.createElement('canvas').getContext('webgl2'); } catch (e) {}
          try {
            var g = document.createElement('canvas').getContext('webgl');
            var d = g && g.getExtension('WEBGL_debug_renderer_info');
            gl1 = g ? (d ? g.getParameter(d.UNMASKED_RENDERER_WEBGL) : 'tak') : 'brak';
          } catch (e) { gl1 = 'błąd'; }
          var box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:16px;right:16px;top:20%;padding:18px;border-radius:18px;background:#fff8ec;color:#5b4a1a;font:15px system-ui,sans-serif;box-shadow:0 6px 24px rgba(40,70,60,.3);z-index:99';
          // same language rule as src/i18n.ts; the details below are for a photo from the tester, so they stay Polish
          var q = /[?&]lang=(pl|en)/.exec(location.search), pl = q ? q[1] === 'pl' : /^pl/i.test(navigator.language);
          box.innerHTML = '<b style="font-size:18px">' + (pl ? 'Gra nie może się uruchomić na tym urządzeniu' : 'The game cannot start on this device') + '</b><p>' +
            (gl2 ? '' : pl ? 'Ta przeglądarka nie ma WebGL 2, którego gra potrzebuje do grafiki 3D. Spróbuj w najnowszym Chrome.' : 'This browser has no WebGL 2, which the game needs for 3D graphics. Try the latest Chrome.') +
            '</p><p style="font-size:12px;opacity:.75;word-break:break-word">Błąd: ' + String(msg).slice(0, 300) + '<br>WebGL 2: ' + (gl2 ? 'tak' : 'nie') + ', WebGL 1: ' + gl1 + '<br>' + navigator.userAgent + '</p>';
          document.body.appendChild(box);
          var h = document.getElementById('hint'); if (h) h.style.display = 'none';
          var l = document.getElementById('load'); if (l) l.style.display = 'none';
        }
        window.addEventListener('error', function (e) { why(e.message || (e.target && e.target.src ? 'nie wczytał się ' + e.target.src : 'nieznany')); }, true);
        window.addEventListener('unhandledrejection', function (e) { why(e.reason && e.reason.message || e.reason); });
        setTimeout(function () { why('gra nie wystartowała w 20 s'); }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
    <script>if ('serviceWorker' in navigator && location.hostname !== 'localhost') navigator.serviceWorker.register('sw.js');</script>
  </body>
</html>
